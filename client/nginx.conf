# Geliştirmedeki Vite proxy'sinin üretim karşılığı: tarayıcı her şeyi tek adresten (localhost:8080) görür,
# böylece CORS gerekmez ve refresh token cookie'si sorunsuz çalışır.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR: WebSocket bağlantısının "Upgrade" başlıkları iletilmeli, bağlantı uzun süre açık kalır.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Uygulama içi adresler (/boards/123 gibi) React Router'a ait: dosya yoksa index.html ver.
    location / {
        try_files $uri /index.html;
    }

    # Vite'ın ürettiği dosya adları içerik hash'i taşır (index-BKERwZIw.js); sonsuza kadar cache'lenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
